name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Verify and write signing credentials
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_BASE64" || -z "$KEYSTORE_STORE_PASSWORD" ||
                -z "$KEYSTORE_KEY_ALIAS" || -z "$KEYSTORE_KEY_PASSWORD" ]]; then
            echo "Release signing is missing. Configure the four KEYSTORE_* GitHub Actions secrets before tagging."
            exit 1
          fi
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > mycar-release.jks
          printf 'storeFile=mycar-release.jks\\nstorePassword=%s\\nkeyAlias=%s\\nkeyPassword=%s\\n' \\
            "$KEYSTORE_STORE_PASSWORD" "$KEYSTORE_KEY_ALIAS" "$KEYSTORE_KEY_PASSWORD" > keystore.properties
          keytool -list -keystore mycar-release.jks \\
            -storepass:env KEYSTORE_STORE_PASSWORD -alias "$KEYSTORE_KEY_ALIAS" > /dev/null \\
            || { echo "Release keystore cannot be opened with the configured credentials"; exit 1; }

      - name: Build release APK and optional GeckoView bundle
        run: |
          version="${GITHUB_REF_NAME#v}"
          version_code=$((50 + GITHUB_RUN_NUMBER))
          ./gradlew :app:assembleRelease :app:bundleRelease \\
            "-PmyCarVersionName=$version" "-PmyCarVersionCode=$version_code"

      # Use the same signing key for the base and the on-demand Android split APKs.
      # A mismatched key or version is refused by Android PackageInstaller.
      - name: Package optional signed GeckoView splits
        env:
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            https://github.com/google/bundletool/releases/download/1.18.2/bundletool-all-1.18.2.jar \
            --output bundletool.jar
          bundle=$(find build/app/outputs/bundle/release -name '*.aab' -print -quit)
          test -n "$bundle"
          umask 077
          printf '%s' "$KEYSTORE_STORE_PASSWORD" > store.pass
          printf '%s' "$KEYSTORE_KEY_PASSWORD" > key.pass
          trap 'rm -f store.pass key.pass' EXIT
          java -jar bundletool.jar build-apks \
            --bundle="$bundle" \
            --output=build/cinema-signed.apks \
            --mode=default \
            --ks=mycar-release.jks \
            --ks-pass=file:store.pass \
            --ks-key-alias="$KEYSTORE_KEY_ALIAS" \
            --key-pass=file:key.pass
          python3 tools/package_gecko_split.py \
            build/cinema-signed.apks build/myCar-gecko-arm64-v8a.zip
          mkdir -p build/gecko-verify
          unzip -q build/myCar-gecko-arm64-v8a.zip -d build/gecko-verify
          signer=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          test -n "$signer"
          "$signer" verify build/myCar-release.apk
          for split in build/gecko-verify/*.apk; do
            "$signer" verify "$split"
          done
          base_sha=$("$signer" verify --print-certs build/myCar-release.apk | awk '/Signer #1 certificate SHA-256 digest:/ {print $NF}')
          test -n "$base_sha"
          for split in build/gecko-verify/*.apk; do
            sha=$("$signer" verify --print-certs "$split" | awk '/Signer #1 certificate SHA-256 digest:/ {print $NF}')
            test "$sha" = "$base_sha" || { echo "Feature signing mismatch: $split"; exit 1; }
          done
          echo "Optional GeckoView splits match the base signing certificate."

      - name: Locate APK
        id: apk
        run: |
          # The build moves its APKs to <root>/build/myCar-<variant>.apk (see renameApk).
          apk=build/myCar-release.apk
          test -f "$apk" || { echo "no APK at $apk"; ls -R build | head -50; exit 1; }
          echo "path=$apk" >> "$GITHUB_OUTPUT"
          # R8's map from the release's short names back to myCar's, so a crash in a driver's log
          # (its stack has the release's names) can be read. The updater takes only the .apk.
          map=$(find build -path '*mapping/release/mapping.txt' | head -1)
          test -n "$map" || { echo "no R8 mapping"; exit 1; }
          cp "$map" "build/myCar-${GITHUB_REF_NAME}-mapping.txt"
          echo "mapping=build/myCar-${GITHUB_REF_NAME}-mapping.txt" >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.apk.outputs.path }}
            ${{ steps.apk.outputs.mapping }}
            build/myCar-gecko-arm64-v8a.zip
          # The hand-written notes go first; GitHub adds the full changelog link under them.
          body_path: .github/release-notes.md
          generate_release_notes: true
          # A normal release, so Obtainium and the app's Stable update channel find it without
          # extra settings. Tick pre-release on GitHub by hand for a build that needs testing first.
          prerelease: false
