name: Build

# Compiles the debug app and runs the unit tests on every push, so a change that doesn't build
# shows up at once. The APK is kept as an artifact, to install on the phone and try in the car.
# Enable manual test builds from Actions > Build; the optional Gecko code is built here.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # With the signing key in the repository's secrets, the debug app is signed with it too, so
      # each new build installs over the last one. Without it (a fork, say), the debug key signs.
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No signing key in the secrets: the debug key signs this build."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > mycar-release.jks
          printf 'storeFile=mycar-release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KEYSTORE_STORE_PASSWORD" "$KEYSTORE_KEY_ALIAS" "$KEYSTORE_KEY_PASSWORD" > keystore.properties

      - name: Optional split archive tests
        run: python3 -m unittest tools/test_package_gecko_split.py

      - name: Build, split bundle and test
        run: ./gradlew :app:assembleDebug :app:bundleDebug :app:testDebugUnitTest --no-daemon --stacktrace

      # A dynamic feature is useful only if the standard installer does not contain GeckoView.
      - name: Confirm base APK stays lightweight
        run: |
          test -f build/myCar-debug.apk
          if unzip -Z1 build/myCar-debug.apk | grep -Eq '(^|/)(libxul[.]so|omni[.]ja)$'; then
            echo "GeckoView native engine leaked into the base APK"
            exit 1
          fi
          echo "No GeckoView native engine found in the base APK"

      # The GeckoView AAR contributes a clipboard ContentProvider and a zygote preload
      # entry to the merged base manifest, although their classes are in a separate split.
      # Android instantiates content providers before Application.onCreate: this caused
      # an immediate startup crash in the first passing debug APK.
      - name: Verify base APK can start without GeckoView
        run: |
          set -euo pipefail
          aapt=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          test -x "$aapt"
          "$aapt" dump xmltree build/myCar-debug.apk AndroidManifest.xml > build/base-manifest.txt
          if grep -E 'org[.]mozilla[.]gecko[.]GeckoClipboardContentProvider|zygotePreloadName' build/base-manifest.txt; then
            echo "GeckoView startup components incorrectly merged into the base APK"
            exit 1
          fi
          echo "Base APK has no Gecko clipboard provider or zygote preload declaration"

      # Every language has every text, with the same placeholders (tools/check_strings.py). After
      # the build, so a missing translation doesn't hide a build error.
      - name: Translations
        run: python3 tools/check_strings.py

      - uses: actions/upload-artifact@v4
        with:
          name: myCar-debug-${{ github.sha }}
          path: build/myCar-debug.apk
          if-no-files-found: error
