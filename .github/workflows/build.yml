name: Build

# Compiles the debug app and runs the unit tests on every push, so a change that doesn't build
# shows up at once. The APK is kept as an artifact, to install on the phone and try in the car.
# Enable manual test builds from Actions > Build; the optional Gecko code is built here.
on:
  push:
  pull_request:
  workflow_dispatch:

# Frequent feature-branch commits should not spend minutes compiling stale revisions.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # With the signing key in the repository's secrets, the debug app is signed with it too, so
      # each new build installs over the last one. Without it (a fork, say), the debug key signs.
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
          KEYSTORE_CERT_SHA256: ${{ secrets.KEYSTORE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ]; then
            if [ -n "$KEYSTORE_STORE_PASSWORD$KEYSTORE_KEY_ALIAS$KEYSTORE_KEY_PASSWORD$KEYSTORE_CERT_SHA256" ]; then
              echo "Signing secrets are incomplete. Run tools/setup-signing.sh on your trusted machine."
              exit 1
            fi
            echo "No persistent key configured; using a per-run debug signer (cannot update previous builds in place)."
            mkdir -p "$HOME/.android"
            if [ ! -f "$HOME/.android/debug.keystore" ]; then
              keytool -genkeypair -noprompt \
                -keystore "$HOME/.android/debug.keystore" \
                -storepass android -keypass android \
                -alias androiddebugkey -keyalg RSA -keysize 2048 \
                -validity 10000 -dname "CN=Android Debug,O=Android,C=US" > /dev/null
            fi
            exit 0
          fi
          if [ -z "$KEYSTORE_STORE_PASSWORD" ] || [ -z "$KEYSTORE_KEY_ALIAS" ] || \
             [ -z "$KEYSTORE_KEY_PASSWORD" ] || [ -z "$KEYSTORE_CERT_SHA256" ]; then
            echo "Signing secrets are incomplete. Run tools/setup-signing.sh on your trusted machine."
            exit 1
          fi
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > mycar-release.jks
          actual=$(keytool -exportcert -rfc -keystore mycar-release.jks \
              -alias "$KEYSTORE_KEY_ALIAS" -storepass:env KEYSTORE_STORE_PASSWORD 2>/dev/null | \
              openssl x509 -inform PEM -outform DER | openssl dgst -sha256 -r | awk '{print $1}')
          if [ "$actual" != "$KEYSTORE_CERT_SHA256" ]; then
            echo "Signing certificate does not match configured pinned fingerprint; refusing the build."
            exit 1
          fi
          printf 'storeFile=mycar-release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KEYSTORE_STORE_PASSWORD" "$KEYSTORE_KEY_ALIAS" "$KEYSTORE_KEY_PASSWORD" > keystore.properties

      - name: Optional split archive and signing tests
        run: python3 -m unittest discover -s tools -p 'test_*.py'

      - name: Build, split bundle and test
        run: ./gradlew :app:assembleDebug :app:bundleDebug :app:testDebugUnitTest "-PmyCarVersionCode=$((50 + GITHUB_RUN_NUMBER))" "-PmyCarCiDebugKeystore=$HOME/.android/debug.keystore" --no-daemon --stacktrace

      # AABs alone are not installable. Exercise the exact split ZIP packaging used for
      # releases against the matching debug APK, before the device tests. The debug
      # signature is only valid for the APK produced by this same workflow run.
      - name: Package a matching debug GeckoView split (test only)
        env:
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          bundle=build/app/outputs/bundle/debug/app-debug.aab
          test -f "$bundle"
          curl --fail --location --retry 3 --max-time 120 \
            https://github.com/google/bundletool/releases/download/1.18.2/bundletool-all-1.18.2.jar \
            --output build/bundletool.jar
          echo "378b5434cd1378bef6b2bc527b8c7f0ff2584b273830335bce54d6d0813c8584  build/bundletool.jar" | sha256sum --check
          umask 077
          if test -s keystore.properties; then
            store=mycar-release.jks
            alias_name="$KEYSTORE_KEY_ALIAS"
            printf '%s' "$KEYSTORE_STORE_PASSWORD" > build/store.pass
            printf '%s' "$KEYSTORE_KEY_PASSWORD" > build/key.pass
          else
            store="$HOME/.android/debug.keystore"
            alias_name=androiddebugkey
            printf '%s' android > build/store.pass
            printf '%s' android > build/key.pass
          fi
          trap 'rm -f build/store.pass build/key.pass' EXIT
          test -f "$store"
          java -jar build/bundletool.jar build-apks \
            --bundle="$bundle" \
            --output=build/cinema-debug.apks \
            --mode=default \
            --ks="$store" \
            --ks-pass=file:build/store.pass \
            --ks-key-alias="$alias_name" \
            --key-pass=file:build/key.pass
          python3 tools/package_gecko_split.py \
            build/cinema-debug.apks build/myCar-gecko-arm64-v8a.zip
          echo "Debug base APK and test-only optional Gecko split are both available"

      - name: Validate signed base and optional feature identity
        run: |
          set -euo pipefail
          mkdir -p build/gecko-splits
          unzip -q build/myCar-gecko-arm64-v8a.zip -d build/gecko-splits
          signer=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          aapt=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          test -x "$signer" && test -x "$aapt"
          signature() {
            "$signer" verify "$1" >/dev/null
            "$signer" verify --print-certs "$1" | awk '/Signer #1 certificate SHA-256 digest:/ {print $NF}'
          }
          identity() {
            "$aapt" dump badging "$1" | grep '^package:' | head -n1 | sed -E "s/.*name='([^']+)'.*versionCode='([^']+)'.*/\\1:\\2/"
          }
          base_signer=$(signature build/myCar-debug.apk)
          base_identity=$(identity build/myCar-debug.apk)
          test -n "$base_signer" && test -n "$base_identity"
          for split in build/gecko-splits/*.apk; do
            test "$(signature "$split")" = "$base_signer" || { echo "Split signer mismatch: $split"; exit 1; }
            test "$(identity "$split")" = "$base_identity" || { echo "Split app ID/version mismatch: $split"; exit 1; }
          done
          unzip -Z1 build/gecko-splits/cinema_gecko-arm64_v8a.apk | grep -qx 'lib/arm64-v8a/libxul.so' \
            || { echo "GeckoView native engine missing from optional split"; exit 1; }
          unzip -Z1 build/gecko-splits/cinema_gecko-master.apk | grep -qx 'classes.dex' \
            || { echo "GeckoView implementation missing from optional feature master"; exit 1; }
          echo "Signed optional splits match debug app ID, versionCode and signing certificate"

      # Compare the DER certificate encoded into APK Signature Scheme v2/v3, not
      # formatted apksigner stdout. Earlier text parsing let two different debug
      # keys pass, causing INSTALL_FAILED_INVALID_APK on the phone and emulator.
      - name: Verify base and GeckoView signing certificates byte-for-byte
        env:
          MYCAR_EXPECT_CERT_SHA256: ${{ secrets.KEYSTORE_CERT_SHA256 }}
        run: |
          python3 tools/check_apk_cert.py build/myCar-debug.apk build/gecko-splits/*.apk

      # A dynamic feature is useful only if the standard installer does not contain GeckoView.
      - name: Confirm base APK stays lightweight
        run: |
          test -f build/myCar-debug.apk
          if unzip -Z1 build/myCar-debug.apk | grep -Eq '(^|/)(libxul[.]so|omni[.]ja)$'; then
            echo "GeckoView native engine leaked into the base APK"
            exit 1
          fi
          echo "No GeckoView native engine found in the base APK"

      # The GeckoView AAR contributes a clipboard ContentProvider and a zygote preload
      # entry to the merged base manifest, although their classes are in a separate split.
      # Android instantiates content providers before Application.onCreate: this caused
      # an immediate startup crash in the first passing debug APK.
      - name: Verify base APK can start without GeckoView
        run: |
          set -euo pipefail
          aapt=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          test -x "$aapt"
          "$aapt" dump xmltree build/myCar-debug.apk AndroidManifest.xml > build/base-manifest.txt
          if grep -E 'org[.]mozilla[.]gecko[.]GeckoClipboardContentProvider|zygotePreloadName' build/base-manifest.txt; then
            echo "GeckoView startup components incorrectly merged into the base APK"
            exit 1
          fi
          echo "Base APK has no Gecko clipboard provider or zygote preload declaration"

      # Every language has every text, with the same placeholders (tools/check_strings.py). After
      # the build, so a missing translation doesn't hide a build error.
      - name: Translations
        run: python3 tools/check_strings.py

      - uses: actions/upload-artifact@v4
        with:
          name: myCar-debug-${{ github.sha }}
          path: |
            build/myCar-debug.apk
            build/myCar-gecko-arm64-v8a.zip
          if-no-files-found: error

  # Compile success does not prove launchability. This separate job installs only the
  # base debug APK into Android, opens the real activity and checks for startup crashes.
  # It deliberately does not install the optional GeckoView split.
  launch-smoke:
    name: Base APK startup (emulator)
    needs: build
    if: github.ref == 'refs/heads/feature/cinema-adblock' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: myCar-debug-${{ github.sha }}
          path: build
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and launch the base APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          script: bash tools/cinema-smoke.sh && bash tools/cinema-split-smoke.sh
